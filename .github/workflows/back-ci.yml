# Pipeline de integração contínua do BACK-END (Aula 15).
# Roda a suíte inteira (unitários, integração com H2 e testes da API REST com MockMvc)
# a cada push/PR que mexa no back. Não precisa de MySQL: os testes usam H2 em memória.
name: Back-end CI

on:
  push:
    branches: [main]
    paths: ['back/**', '.github/workflows/back-ci.yml']
  pull_request:
    paths: ['back/**', '.github/workflows/back-ci.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: back/ecommerce-pedidos-RV

jobs:
  testes:
    name: mvn verify (JUnit + MockMvc + JaCoCo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: mvn -B verify
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: relatorio-cobertura-jacoco
          path: back/ecommerce-pedidos-RV/target/site/jacoco
          retention-days: 14
