# Configuração usada só no mvn test: banco H2 em memória, modo compatível com MySQL.
# Assim os testes rodam no CI (Aula 15) sem precisar de um MySQL de verdade.
spring.datasource.url=jdbc:h2:mem:ecommerce;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# No teste o Hibernate cria e derruba as tabelas a cada execução
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
