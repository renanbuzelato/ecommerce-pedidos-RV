spring.application.name=ecommerce-pedidos-RV

# Aula 14 - acesso ao banco (segredos lidos de variáveis de ambiente, padrão opcional após ':')
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}

# validate: o Hibernate só confere se as tabelas batem com as entidades.
# O schema.sql (src/main/resources/db/schema.sql) continua sendo a fonte da verdade.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Desliga o "open session in view": a sessão do JPA fica só dentro da transação do serviço
spring.jpa.open-in-view=false
